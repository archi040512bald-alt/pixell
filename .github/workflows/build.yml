name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: unzip PixelLauncher.zip
      - name: Fix code
        run: |
          sed -i 's/\bAppInfo\b/LauncherApp/g' PixelLauncher/app/src/main/java/com/example/pixellauncher/MainActivity.kt
          mkdir -p PixelLauncher/app/src/main/res/values
          cat > PixelLauncher/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.DayNight.NoActionBar" parent="@android:style/Theme.DeviceDefault.Wallpaper.NoTitleBar"/>
          </resources>
          EOF
      - run: cd PixelLauncher && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PixelLauncher-apk
          path: PixelLauncher/app/build/outputs/apk/debug/app-debug.apk
